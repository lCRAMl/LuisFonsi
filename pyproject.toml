[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "palletizer"
version = "0.1.0"
description = "Palettieralgorithmus für einen Portalroboter – Berechnung und Vorlage für die SPS (SCL)"
readme = "README.md"
requires-python = ">=3.11"
# Der Rechenkern kommt bewusst ohne externe Pakete aus (nur Standardbibliothek).
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
palletizer = "palletizer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
