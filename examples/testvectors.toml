# Fallsammlung für die Testvektoren der SPS.
# Erzeugen:  python -m palletizer testvectors
# Ergebnis:  examples/testvectors/<name>/*.csv  und  examples/testvectors/index.csv
#
# Jeder Fall enthält die Eingabeparameter wie in config/defaults.toml,
# nicht angegebene Parameter haben die Standardwerte.

